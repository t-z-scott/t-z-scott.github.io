---
layout: default
---
<!-- edited from Hacker theme -->
<h1>{{ page.title }}</h1>

{{content}}

<div>
  <small>published: {{ page.date | date: "%-d %B %Y" }}</small><br>
  {% if page.updated %}
    <small>updated: {{ page.updated | date: "%-d %B %Y" }}</small>
  {% endif %}
  <small>word count: {{ content | number_of_words }}</small><br>
  {% if page.tags %}
    <small>tags: <em>{{ page.tags | join: "</em> - <em>" }}</em></small><br>
  {% endif %}
</div>
